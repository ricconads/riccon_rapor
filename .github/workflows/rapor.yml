name: Gunluk Rapor

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  rapor-olustur:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu cek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutuphaneleri kur
        run: pip install requests python-dotenv facebook-business google-ads ShopifyAPI

      - name: Env dosyasini olustur
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_LONG_TOKEN: ${{ secrets.META_LONG_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          GOOGLE_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_DEVELOPER_TOKEN }}
          GOOGLE_CUSTOMER_ID: ${{ secrets.GOOGLE_CUSTOMER_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          echo "META_APP_ID=$META_APP_ID" >> .env
          echo "META_APP_SECRET=$META_APP_SECRET" >> .env
          echo "META_LONG_TOKEN=$META_LONG_TOKEN" >> .env
          echo "META_AD_ACCOUNT_ID=$META_AD_ACCOUNT_ID" >> .env
          echo "GOOGLE_DEVELOPER_TOKEN=$GOOGLE_DEVELOPER_TOKEN" >> .env
          echo "GOOGLE_CUSTOMER_ID=$GOOGLE_CUSTOMER_ID" >> .env
          echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" >> .env
          echo "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> .env
          echo "GOOGLE_REFRESH_TOKEN=$GOOGLE_REFRESH_TOKEN" >> .env
          echo "SHOPIFY_ACCESS_TOKEN=$SHOPIFY_ACCESS_TOKEN" >> .env
          echo "SHOPIFY_STORE=$SHOPIFY_STORE" >> .env
          echo "SHOPIFY_CLIENT_ID=$SHOPIFY_CLIENT_ID" >> .env
          echo "SHOPIFY_CLIENT_SECRET=$SHOPIFY_CLIENT_SECRET" >> .env

      - name: Google Ads yaml olustur
        env:
          GOOGLE_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_DEVELOPER_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_LOGIN_CUSTOMER_ID }}
          GOOGLE_CUSTOMER_ID: ${{ secrets.GOOGLE_CUSTOMER_ID }}
        run: |
          echo "developer_token: $GOOGLE_DEVELOPER_TOKEN" >> google-ads.yaml
          echo "client_id: $GOOGLE_CLIENT_ID" >> google-ads.yaml
          echo "client_secret: $GOOGLE_CLIENT_SECRET" >> google-ads.yaml
          echo "refresh_token: $GOOGLE_REFRESH_TOKEN" >> google-ads.yaml
          echo "login_customer_id: $GOOGLE_LOGIN_CUSTOMER_ID" >> google-ads.yaml
          echo "customer_id: $GOOGLE_CUSTOMER_ID" >> google-ads.yaml
          echo "use_proto_plus: True" >> google-ads.yaml

      - name: Output klasoru olustur
        run: mkdir -p output

      - name: Raporu olustur
        run: python3 scripts/rapor.py

      - name: Netlify ye yukle
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: './output'
          site-id: ${{ secrets.NETLIFY_SITE_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Gunluk rapor guncellendi"
          production-deploy: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
